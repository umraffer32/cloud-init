#cloud-config
hostname: devbox
manage_etc_hosts: true
preserve_hostname: false

users:
  - name: dev
    groups: [sudo, adm]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBdIMlfyxWmZPMylyPkWRXJ/obDIRDesX6dS7m4TLXpa mrpocket@pickleboy
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFs7+oB1mLnCUj1EVQlZ8iAovxq5NozIzv5MgOLpwhZG uriah@SlicksPC

package_update: true
package_upgrade: true
packages:
  - qemu-guest-agent
  - curl
  - git
  - nano
  - htop
  - tmux
  - unzip
  - net-tools
  - dnsutils
  - jq
  - ca-certificates
  - gnupg
  - lsb-release
  - software-properties-common
  - python3-pip
  - ansible

runcmd:

  # Service hardening
  - systemctl enable --now qemu-guest-agent
  - sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - systemctl reload ssh

  # Terraform via HashiCorp's apt repo
  - wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
  - echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" > /etc/apt/sources.list.d/hashicorp.list
  - apt update
  - apt install -y terraform

  # AWS CLI v2 (official installer)
  - curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
  - unzip -q /tmp/awscliv2.zip -d /tmp
  - /tmp/aws/install
  - rm -rf /tmp/awscliv2.zip /tmp/aws

  # AWS Session Manager plugin (for Ansible aws_ssm connection)
  - curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/session-manager-plugin.deb
  - dpkg -i /tmp/session-manager-plugin.deb
  - rm /tmp/session-manager-plugin.deb

  # Docker Engine + Compose plugin (official repo)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL "https://download.docker.com/linux/ubuntu/gpg" -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker dev

timezone: America/Los_Angeles

